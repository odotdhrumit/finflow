name: Build FinFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FinFlow
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Debug Keystore and Environment
        run: |
          # 1. Decode debug.keystore from repository base64
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          touch .env

          # 3. Ensure Gradle Wrapper is executable
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build FinFlow APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload FinFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
